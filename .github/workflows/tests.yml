name: Offline regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADIO_ANALYTICS_ENABLED: 'False'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-demo.txt -r requirements-dev.txt
      - name: Run tests and measure core coverage
        run: python -B -m pytest -q --cov=cv_human_video_matting --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
