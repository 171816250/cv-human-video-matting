project:
  name: cv-human-video-matting

device:
  mode: auto

input:
  # null keeps the source resolution; an integer limits the shorter side without upscaling.
  resize_short: null

matting:
  model: rvm_mobilenetv3
  # null uses the model's pretrained weights; set an existing file for a custom checkpoint.
  checkpoint: null
  # Optional verified offline RVM code + weights directory, mutually exclusive with checkpoint.
  bundle: null
  downsample_ratio: auto

postprocess:
  enable_temporal_smooth: false
  temporal_alpha: 0.75
  # Only used when smoothing is enabled; adaptive reduces history at changing edges.
  temporal_mode: adaptive
  temporal_motion_threshold: 0.15
  edge_feather: 0
  mask_open: 0
  mask_close: 0

depth:
  enabled: false
  model: MiDaS_small
  interval: 5
  # Relative inverse-depth thresholds: higher values indicate nearer regions, not meters.
  thresholds:
    near: 0.66
    mid: 0.33

render:
  mode: green
  preserve_audio: true
  # Used by green (solid background) and side_by_side modes; format is #RRGGBB.
  background_color: "#00FF00"

paths:
  input_dir: data/input
  background_dir: data/backgrounds
  output_dir: data/output
  weights_dir: weights
