project:
  name: cv-human-video-matting

device:
  mode: auto

input:
  source: video
  resize_short: 720

matting:
  model: rvm_mobilenetv3
  checkpoint: weights/rvm_mobilenetv3.pth
  downsample_ratio: auto

postprocess:
  enable_temporal_smooth: false
  temporal_alpha: 0.75
  edge_feather: 0
  mask_open: 0
  mask_close: 0

depth:
  enabled: false
  model: MiDaS_small
  interval: 5
  label_mode: relative
  thresholds:
    near: 0.66
    mid: 0.33

render:
  mode: green
  background_color: "#00FF00"

paths:
  input_dir: data/input
  background_dir: data/backgrounds
  output_dir: data/output
  weights_dir: weights
